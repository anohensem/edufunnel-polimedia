services:
  backend:
    build: ./backend
    container_name: polimedia-backend
    ports:
      - "4000:4000"
    environment:
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/prediksi-polimedia
    depends_on:
      - n8n

  n8n:
    image: n8nio/n8n:latest
    container_name: polimedia-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n

  # Jembatan otomatis agar n8n Docker lokal bisa diakses oleh Vercel dari internet
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: polimedia-tunnel
    command: tunnel --no-autoupdate --url http://n8n:5678
    depends_on:
      - n8n

volumes:
  n8n_data: